<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schnuffels Wohnzimmer</title>
<meta name="description" content="Ein begehbares Wohnzimmer im Cel-Shading-Look mit der knuddeligen Spielfigur Schnuffel.">
<style>
@font-face{font-family:'Fredoka';font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:500;font-display:swap;src:url(fonts/nunito-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
/* Layout: full-bleed 3D-Diorama, darüber schwebende Notizzettel-HUDs an den Ecken */
:root{
  --night:#1c1814;      /* Hintergrund hinter dem Diorama */
  --panel:rgba(34,27,22,.78);
  --paper:#f7ecdc;      /* Text */
  --muted:#c9b79f;
  --apricot:#f2a65a;    /* Akzent, Lampenlicht */
  --mint:#9ed9c0;       /* Knödel */
  --ink:#2b2019;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
.card{position:fixed;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);color:var(--paper)}
.title{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 16px 11px;transform:rotate(-1.2deg)}
.title h1{margin:0;font:600 22px/1.1 var(--display);letter-spacing:.2px}
.title h1 span{color:var(--mint)}
.title p{margin:3px 0 0;font-size:12px;color:var(--muted);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.help{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 14px;font-size:12.5px;line-height:1.75;color:var(--muted)}
.help b{color:var(--paper);font-weight:700}
kbd{display:inline-block;min-width:1.5em;padding:0 .4em;margin-right:2px;border-radius:5px;background:var(--paper);color:var(--ink);font:700 11px/1.6 var(--body);text-align:center;box-shadow:0 2px 0 var(--muted)}
#prompt{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font:600 16px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:pop .25s ease-out}
#prompt kbd{background:var(--apricot);box-shadow:0 2px 0 #b8743a;font-size:12px}
#prompt:focus-visible,.pad button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(247,236,220,.12);border:2px solid rgba(247,236,220,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--mint);box-shadow:0 3px 0 #5f9e86}
.pad{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end}
.pad button{width:68px;height:68px;border-radius:50%;border:0;font:600 14px/1 var(--display);color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--muted);touch-action:manipulation}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muted)}
.touch #prompt{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(440px,calc(100vw - 32px));padding:9px 16px;border-radius:12px;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper);font:600 15px/1.35 var(--display);text-align:center;animation:pop .25s ease-out}
@media (max-width:760px){#toast{top:calc(84px + env(safe-area-inset-top,0px))}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:500 16px/1.5 var(--body)}
@media (max-width:520px){.title h1{font-size:18px}.title p{font-size:11px}}
@media (max-width:600px){.help{display:none}}
</style>
</head>
<body>

<div id="stage"></div>
<header class="card title"><h1>Schnuffels <span>Wohnzimmer</span></h1><p>Altbau · 5,6 × 6,6 m · Deckenhöhe 3,2 m</p></header>
<div class="card help" id="help">
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> laufen · <kbd>␣</kbd> hüpfen · <kbd>E</kbd> benutzen</div>
  <div><b>Maus ziehen</b> Kamera drehen · <b>Mausrad</b> zoomen</div>
</div>
<button id="prompt" type="button" hidden><kbd>E</kbd><span></span></button>
<div id="joy" hidden><div id="knob"></div></div>
<div class="pad" id="pad" hidden><button id="bJump" type="button">Hüpfen</button></div>
<div id="toast" role="status" hidden></div>
<div id="err" hidden>Das 3D-Zimmer konnte nicht geladen werden. Dein Browser braucht WebGL – versuch es bitte in einem aktuellen Chrome, Firefox oder Safari.</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const T3=THREE, PI=Math.PI;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=matchMedia('(pointer: coarse)').matches;
if(isTouch){document.body.classList.add('touch');document.getElementById('joy').hidden=false;document.getElementById('pad').hidden=false;document.getElementById('help').hidden=true;document.querySelector('#prompt kbd').textContent='Tipp';}

/* ---------- Renderer ---------- */
let renderer;
try{renderer=new T3.WebGLRenderer({antialias:false,powerPreference:'high-performance'});}catch(e){document.getElementById('err').hidden=false;return;}
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new T3.Scene();
const BG=new T3.Color(0x1c1814), NBG=new T3.Color(0x8080ff);
scene.background=BG;
const camera=new T3.PerspectiveCamera(48,1,0.1,40);
camera.layers.enable(1);

/* ---------- Materialien ---------- */
const grad=(()=>{const d=new Uint8Array([70,70,70,255,150,150,150,255,215,215,215,255,255,255,255,255]);const t=new T3.DataTexture(d,4,1,T3.RGBAFormat);t.minFilter=t.magFilter=T3.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const MC={};
const toon=c=>MC[c]||(MC[c]=new T3.MeshToonMaterial({color:c,gradientMap:grad}));
const toonMap=t=>new T3.MeshToonMaterial({map:t,gradientMap:grad});
function mesh(geo,mat,x=0,y=0,z=0,p=scene){const m=new T3.Mesh(geo,typeof mat==='number'?toon(mat):mat);m.position.set(x,y,z);p.add(m);return m;}
const box=(w,h,d,mat,x,y,z,p)=>mesh(new T3.BoxGeometry(w,h,d),mat,x,y,z,p);
const boxB=(w,h,d,mat,x,y0,z,p)=>box(w,h,d,mat,x,y0+h/2,z,p);
const cyl=(rt,rb,h,mat,x,y,z,p,s=20)=>mesh(new T3.CylinderGeometry(rt,rb,h,s),mat,x,y,z,p);
const sph=(r,mat,x,y,z,p,ws=20,hs=14)=>mesh(new T3.SphereGeometry(r,ws,hs),mat,x,y,z,p);
const grp=(x=0,y=0,z=0,p=scene)=>{const g=new T3.Group();g.position.set(x,y,z);p.add(g);return g;};
function rbox(w,h,d,r,n=10,z=3){
  r=Math.min(r,w/2-1e-3,h/2-1e-3,d/2-1e-3);
  const g=new T3.BoxGeometry(w,h,d,n,n,n),P=g.attributes.position,N=g.attributes.normal;
  const rm=(v,half)=>{const i=Math.round((v+half)/(2*half)*n);if(i<=z)return -half+r*(i/z);if(i>=n-z)return half-r*((n-i)/z);return -half+r+(i-z)/(n-2*z)*(2*half-2*r);};
  const v=new T3.Vector3(),c=new T3.Vector3(),hw=w/2-r,hh=h/2-r,hd=d/2-r;
  for(let i=0;i<P.count;i++){
    v.set(rm(P.getX(i),w/2),rm(P.getY(i),h/2),rm(P.getZ(i),d/2));
    c.set(Math.max(-hw,Math.min(hw,v.x)),Math.max(-hh,Math.min(hh,v.y)),Math.max(-hd,Math.min(hd,v.z)));
    const dir=v.clone().sub(c);
    if(dir.lengthSq()>1e-10){dir.normalize();v.copy(c).addScaledVector(dir,r);N.setXYZ(i,dir.x,dir.y,dir.z);}
    P.setXYZ(i,v.x,v.y,v.z);
  }
  return g;
}
const rb=(w,h,d,r,mat,x,y,z,p)=>mesh(rbox(w,h,d,r),mat,x,y,z,p);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T3.CanvasTexture(c);t.anisotropy=4;return t;}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ---------- Maße ---------- */
const hx=2.8,hz=3.3,H=3.2,TW=0.14;
const colliders=[];
const col=(x0,x1,z0,z1)=>colliders.push({x0,x1,z0,z1});

/* ---------- Boden ---------- */
boxB(2*hx+2*TW+0.36,0.3,2*hz+2*TW+0.36,0x3a2b21,0,-0.32,0);
const floorTex=canvasTex(512,512,(g,w,h)=>{
  const n=11,pw=w/n;
  for(let i=0;i<n;i++){let y=-rnd()*h;while(y<h){const len=h*(0.45+rnd()*0.6);g.fillStyle=`hsl(${29+rnd()*7},${42+rnd()*12}%,${44+rnd()*9}%)`;g.fillRect(i*pw,y,pw,len);g.fillStyle='rgba(70,40,18,.55)';g.fillRect(i*pw,y,pw,2);y+=len;}}
  for(let k=0;k<700;k++){g.fillStyle=`rgba(90,55,25,${0.06+rnd()*0.1})`;g.fillRect(rnd()*w,rnd()*h,1+rnd(),20+rnd()*70);}
  g.fillStyle='rgba(70,40,18,.6)';for(let i=0;i<n;i++)g.fillRect(i*pw,0,2,h);
});
floorTex.wrapS=floorTex.wrapT=T3.RepeatWrapping;floorTex.repeat.set(hx,hz);
const floor=mesh(new T3.PlaneGeometry(2*hx,2*hz),toonMap(floorTex));floor.rotation.x=-PI/2;

/* ---------- Wände mit Cutaway ---------- */
const WALL=0xefe5d3, WHITE=0xf4f1ea;
const walls=[];
function makeWall(name,len,holes,pos,rotY,isCut){
  const root=grp(pos[0],0,pos[2]);root.rotation.y=rotY;
  const shell=grp(0,0,0,root);
  let cur=-len/2;
  const seg=(a,b,y0,y1)=>{if(b-a>1e-3&&y1-y0>1e-3)boxB(b-a,y1-y0,TW,WALL,(a+b)/2,y0,-TW/2,shell);};
  holes.sort((a,b)=>a.c-b.c).forEach(o=>{seg(cur,o.c-o.w/2,0,H);seg(o.c-o.w/2,o.c+o.w/2,o.y1,H);seg(o.c-o.w/2,o.c+o.w/2,0,o.y0);cur=o.c+o.w/2;});
  seg(cur,len/2,0,H);
  boxB(len,0.02,TW+0.002,0x3a2b21,0,H,-TW/2,shell);
  const mounted=grp(0,0,0,scene);
  const w={name,shell,mounted,isCut,cut:1};walls.push(w);return w;
}
const wN=makeWall('N',2*hx+2*TW,[{c:-1.2,w:1.15,y0:0.85,y1:3.0},{c:1.2,w:1.15,y0:0.85,y1:3.0}],[0,0,-hz],0,c=>c.z<-hz+0.3);
const wS=makeWall('S',2*hx+2*TW,[{c:1.9,w:0.92,y0:0,y1:2.3}],[0,0,hz],PI,c=>c.z>hz-0.3);
const wW=makeWall('W',2*hz,[{c:-2.7,w:0.84,y0:0,y1:2.25}],[-hx,0,0],PI/2,c=>c.x<-hx+0.3);
const wE=makeWall('E',2*hz,[],[hx,0,0],-PI/2,c=>c.x>hx-0.3);

/* Fußleisten (bleiben immer sichtbar) */
boxB(2*hx,0.09,0.02,WHITE,0,0,-hz+0.01);boxB(5.5,0.09,0.02,WHITE,-hx+0.01,0,-0.55).rotation.y=PI/2;boxB(0.1,0.09,0.02,WHITE,-hx+0.01,0,3.25).rotation.y=PI/2;boxB(2*hz,0.09,0.02,WHITE,hx-0.01,0,0).rotation.y=PI/2;
boxB(4.16,0.09,0.02,WHITE,0.72,0,hz-0.01);boxB(0.37,0.09,0.02,WHITE,-2.615,0,hz-0.01);

/* ---------- Fenster (Nordwand) ---------- */
const nightTex=canvasTex(128,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#16202e');gr.addColorStop(1,'#26303c');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.07)';g.beginPath();g.moveTo(20,0);g.lineTo(60,0);g.lineTo(10,h*0.6);g.lineTo(-30,h*0.6);g.fill();});
const glassMat=new T3.MeshBasicMaterial({map:nightTex});
[-1.2,1.2].forEach(cx=>{
  const M=wN.mounted, ww=1.15,y0=0.85,y1=3.0,zc=-hz-TW*0.5;
  mesh(new T3.PlaneGeometry(ww,y1-y0),glassMat,cx,(y0+y1)/2,zc-0.02,M);
  const fr=(w,h,x,y)=>box(w,h,0.09,WHITE,x,y,zc,M);
  fr(0.07,y1-y0,cx-ww/2+0.035,(y0+y1)/2);fr(0.07,y1-y0,cx+ww/2-0.035,(y0+y1)/2);fr(0.06,y1-y0,cx,(y0+y1)/2);
  fr(ww,0.07,cx,y1-0.035);fr(ww,0.08,cx,y0+0.04);fr(ww,0.06,cx,y0+(y1-y0)*0.68);
  [cx-0.12,cx+0.12].forEach(x=>box(0.02,0.1,0.03,0xd7d0c2,x,y0+(y1-y0)*0.5,zc+0.06,M));
  boxB(ww+0.12,0.04,0.3,WHITE,cx,y0-0.04,-hz+0.08,M);
  // Bücher auf dem Fensterbrett
  let bx=cx-ww/2+0.04;const bend=cx+(cx<0?0.15:-0.05);
  while(bx<bend){const bw=0.025+rnd()*0.03,bh=0.17+rnd()*0.08;boxB(bw,bh,0.15,pick([0xc0563f,0xe0b74d,0x3f6d8c,0xd98f6b,0x6d8f5a,0xefe2c4,0x8b3a4a,0x2f3b4c]),bx+bw/2,y0,-hz+0.04,M);bx+=bw+0.003;}
  if(cx>0){cyl(0.06,0.05,0.1,0xe9e4da,cx+0.45,y0+0.05,-hz+0.04,M);for(let i=0;i<3;i++){const c=cyl(0.018,0.022,0.14+i*0.04,0x5f8f5a,cx+0.43+i*0.025,y0+0.15+i*0.02,-hz+0.04,M,8);}}
  // Heizkörper
  const rad=grp(cx,0,-hz+0.075);boxB(0.95,0.52,0.06,WHITE,0,0.18,0,rad);for(let i=0;i<14;i++)boxB(0.03,0.5,0.03,0xe4e0d6,-0.44+i*0.068,0.19,0.04,rad);cyl(0.02,0.02,0.08,0xd9d4c8,0.52,0.25,0.02,rad,10);
  // Vorhänge + Stange
  const rod=cyl(0.016,0.016,2.05,0x24201c,cx,3.12,-hz+0.13,M,10);rod.rotation.z=PI/2;sph(0.035,0x24201c,cx-1.03,3.12,-hz+0.13,M,10,8);sph(0.035,0x24201c,cx+1.03,3.12,-hz+0.13,M,10,8);
  [-1,1].forEach(s=>{const g=new T3.BoxGeometry(0.4,3.04,0.05,10,6,1);const P=g.attributes.position;for(let i=0;i<P.count;i++){const x=P.getX(i),y=P.getY(i);P.setZ(i,P.getZ(i)+Math.sin(x*26+s)*0.035);P.setX(i,x*(1+(-y+1.5)*0.06));}g.computeVertexNormals();mesh(g,0xe6dcc6,cx+s*(ww/2+0.14),1.56,-hz+0.15,M);});
});
/* Plattencover zwischen den Fenstern */
function framed(p,w,h,tex,x,y,z,ry,frame=0x1f1a17,matte=0){
  const g=grp(x,y,z,p);g.rotation.y=ry;box(w+0.04,h+0.04,0.025,frame,0,0,0,g);
  if(matte)box(w-0.01,h-0.01,0.004,WHITE,0,0,0.013,g);
  mesh(new T3.PlaneGeometry(w-matte*2,h-matte*2),toonMap(tex),0,0,0.016,g);return g;}
const cover1=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#8ccbc9';g.fillRect(0,0,w,h);g.fillStyle='#1d3b45';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText('L O O P',w/2,22);g.fillStyle='#d9733f';g.beginPath();g.moveTo(20,92);g.quadraticCurveTo(64,30,108,86);g.lineTo(70,74);g.closePath();g.fill();g.fillStyle='#f3e3b8';g.beginPath();g.arc(66,68,13,0,7);g.fill();});
const cover2=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#211b1c';g.fillRect(0,0,w,h);const r=g.createRadialGradient(64,64,6,64,64,42);r.addColorStop(0,'#ffb04a');r.addColorStop(.6,'#c2321f');r.addColorStop(1,'rgba(120,20,10,0)');g.fillStyle=r;g.beginPath();g.arc(64,64,44,0,7);g.fill();g.fillStyle='#f1e6d0';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText('MAJORA',64,68);});
const cover3=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#1e2a22';g.fillRect(0,0,w,h);for(let i=0;i<26;i++){g.fillStyle=pick(['#c6493a','#e7b34d','#3f7a5c','#d7d0bd','#7a4b8c']);g.globalAlpha=.75;g.save();g.translate(rnd()*w,rnd()*h);g.rotate(rnd()*3);g.fillRect(-8,-4,10+rnd()*22,6+rnd()*12);g.restore();}g.globalAlpha=1;});
framed(wN.mounted,0.31,0.31,cover1,0,2.6,-hz+0.014,0,0xdfe9ea);
framed(wN.mounted,0.31,0.31,cover2,-0.08,2.1,-hz+0.014,0);
framed(wN.mounted,0.31,0.31,cover3,0.02,1.62,-hz+0.014,0);

/* Beistelltische mit Büchern & Bogenhanf zwischen den Fenstern */
function hairpinTable(x,z,y,r,top=0x8a5a36,legs=0x1e1a17){
  const g=grp(x,0,z);cyl(r,r,0.04,top,0,y,0,g,24);
  for(let i=0;i<3;i++){const a=i/3*PI*2+0.3;const l=cyl(0.008,0.008,y,legs,Math.cos(a)*r*0.6,y/2,Math.sin(a)*r*0.6,g,6);l.rotation.z=Math.cos(a)*0.12;l.rotation.x=-Math.sin(a)*0.12;}
  return g;}
hairpinTable(-0.18,-hz+0.48,0.56,0.2);hairpinTable(0.24,-hz+0.75,0.44,0.2);
for(let i=0;i<5;i++){const b=boxB(0.2-i*0.01,0.035,0.15,pick([0xb3473a,0xe0b74d,0x6e2f3e,0xf0e5cc,0x355a73]),0.24,0.46+i*0.035,-hz+0.75);b.rotation.y=rnd()*0.4-0.2;}
const snake=grp(-0.18,0.58,-hz+0.48);
cyl(0.09,0.075,0.18,0xeee8de,0,0.09,0,snake,18);
const snakeLeaves=[];
for(let i=0;i<9;i++){const a=i/9*PI*2,l=0.35+rnd()*0.3;const lf=mesh(new T3.ConeGeometry(0.035,l,4),0x4f8a4a,Math.cos(a)*0.035,0.18+l/2,Math.sin(a)*0.035,snake);lf.scale.z=0.35;lf.rotation.set(Math.sin(a)*0.25,a,-Math.cos(a)*0.25);snakeLeaves.push(lf);}
col(-0.45,0.5,-hz,-hz+1.0);

    const mx=fx*iy+rx*ix,mz=fz*iy+rz*ix;
    const targetSpeed=Math.hypot(mx,mz)*2.3;speed+=(targetSpeed-speed)*Math.min(1,dt*10);
    if(moving){const th=Math.atan2(mx,mz);let d=th-heading;d=Math.atan2(Math.sin(d),Math.cos(d));heading+=d*Math.min(1,dt*12);
      const m=Math.hypot(mx,mz);tmp.set(mx/m,0,mz/m);kn.position.x+=tmp.x*speed*dt;kn.position.z+=tmp.z*speed*dt;}
    else speed*=0.8;
    collide(kn.position);
    vy-=11*dt;kn.position.y+=vy*dt;if(kn.position.y<0){if(vy<-2)squash=0.35;kn.position.y=0;vy=0;}
  }
  kn.rotation.y=heading;
  // Animation
  squash*=Math.pow(0.002,dt);
  const air=kn.position.y>0.01;
  if(st.sit){phase=0;feet.forEach((f,i)=>{f.position.set((i?1:-1)*0.11,0.04,0.2);});rig.position.y=0.0;const br=1+Math.sin(t*1.6)*0.02;rig.scale.set(br,1/br,br);
    sitTimer+=dt;if(sitTimer>4&&Math.random()<dt*0.7)burst('z',tmp.copy(kn.position).add(v3(0,0.95,0)),1,0.1,0.35,0.12);}
  else if(st.read){readT+=dt;rig.position.y=-0.07;rig.rotation.x=0.18+Math.sin(t*1.3)*0.02;rig.rotation.z=0;rig.scale.set(1,1,1);
    feet.forEach((f,i)=>f.position.set((i?1:-1)*0.12,0.04,0.24));
    arms.forEach((a,i)=>a.position.set((i?1:-1)*0.17,0.22,0.22));
    flipT+=dt;if(flipT>3.2){flipT=0;pageSound();}flip.rotation.z=flipT<0.6?(flipT/0.6)*PI:0;
    if(readT>12&&Math.random()<dt*0.5)burst('z',tmp.copy(kn.position).add(v3(0,0.85,0)),1,0.1,0.35,0.12);}
  else{
    const sp=speed/2.3;phase+=dt*speed*7.5;
    feet.forEach((f,i)=>{const s=i?1:-1;const ph=phase+(i?PI:0);f.position.set(s*0.11,0.04+(air?0.03:Math.max(0,Math.sin(ph))*0.06*sp),0.03+Math.cos(ph)*0.09*sp);});
    const bob=air?0.02:Math.abs(Math.sin(phase))*0.045*sp;
    rig.position.y=bob;rig.rotation.x=sp*0.12;rig.rotation.z=Math.sin(phase)*0.06*sp;
    const br=1+Math.sin(t*2.2)*0.012*(1-sp);
    const sq=squash;rig.scale.set(br*(1+sq*0.4),(1/br)*(1-sq*0.5),br*(1+sq*0.4));
    arms.forEach((a,i)=>{a.position.x=(i?1:-1)*0.26;a.position.z=0.04+Math.sin(phase+(i?0:PI))*0.06*sp;a.position.y=0.23+(air?0.06:0);});
  }
  ears.forEach((e,i)=>{e.rotation.z=-(i?1:-1)*(0.35+Math.sin(t*3+i)*0.04+(air?0.25:0)+speed*0.04);});
  sprout.rotation.z=Math.sin(t*2.5)*0.15-speed*0.05;sprout.rotation.x=-speed*0.12;
  blinkT-=dt;const bl=blinkT<0.12?0.15:1;eyes.forEach(e=>e.scale.y=bl);if(blinkT<0)blinkT=2+Math.random()*3;
  shadow.position.set(kn.position.x,(st.sit?0.4:0.022),kn.position.z);shadow.scale.setScalar(1-Math.min(0.5,kn.position.y*0.6));
  // Interaktion
  let best=null,bd=1e9;
  if(st.sit)best=inter.find(i=>i.id==='sofa');
  else if(st.read)best=readStop;
  else for(const it of inter){const d=Math.hypot(kn.position.x-it.x,kn.position.z-it.z);if(d<it.r&&d<bd){bd=d;best=it;}}
  if(best!==current){current=best;promptEl.hidden=!best;}
  if(best){const l=best.label();if(promptTxt.textContent!==l)promptTxt.textContent=l;}
  // Lichter
  floorLight.intensity+=((st.floor?0.85:0)-floorLight.intensity)*Math.min(1,dt*10);fShadeIn.material=st.floor?fShadeOn:fShadeOff;
  tableLight.intensity+=((st.table?0.8:0)-tableLight.intensity)*Math.min(1,dt*10);tShade.material=st.table?tShadeOn:tShadeOff;
  const flick=reduceMotion?0:Math.sin(t*7)*0.06+Math.sin(t*13)*0.04;
  tvLight.intensity+=((st.tv?0.7+flick:0)-tvLight.intensity)*Math.min(1,dt*8);
  sun.intensity+=((st.ceil?0.55:0)-sun.intensity)*Math.min(1,dt*8);hemi.intensity+=((st.ceil?0.75:0.42)-hemi.intensity)*Math.min(1,dt*8);
  tvT+=dt;if(st.tv&&tvT>1/20){tvT=0;drawTV(t);tvTex.needsUpdate=true;}else if(!st.tv&&tvT>0.5){tvT=0;drawTV(t);tvTex.needsUpdate=true;}
  // Wackeln
  for(const k in st.wiggle){st.wiggle[k]*=Math.pow(0.15,dt);if(st.wiggle[k]<0.01)delete st.wiggle[k];}
  const wv=k=>(st.wiggle[k]||0)*Math.sin(t*22);
  schefLeaves.forEach((l,i)=>l.position.x+=Math.sin(t*20+i)*0.002*(st.wiggle.schef||0));schef.rotation.z=wv('schef')*0.04;
  snake.rotation.z=wv('snake')*0.08;ukeIn.rotation.z=wv('uke')*0.08;plush.scale.set(1+wv('plush')*0.12,1-wv('plush')*0.12,1);
  // Partikel
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(p.delay>0){p.delay-=dt;continue;}p.life+=dt;p.v.y+=p.g*dt;p.s.position.addScaledVector(p.v,dt);p.v.x*=0.98;p.v.z*=0.98;
    const k=p.life/p.max;p.s.scale.setScalar(p.size*Math.min(1,p.life*6)*(1-Math.max(0,k-0.7)/0.3));if(p.life>=p.max||p.s.position.y<0.02){scene.remove(p.s);p.s.material.dispose();parts.splice(i,1);}}
  // Kamera
  yaw+=(tYaw-yaw)*Math.min(1,dt*8);pitch+=(tPitch-pitch)*Math.min(1,dt*8);dist+=(tDist-dist)*Math.min(1,dt*8);
  camTarget.lerp(tmp.set(kn.position.x,kn.position.y*0.5+0.55,kn.position.z),Math.min(1,dt*6));
  camera.position.set(camTarget.x+Math.sin(yaw)*Math.cos(pitch)*dist,camTarget.y+Math.sin(pitch)*dist,camTarget.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(camTarget);
  // Cutaway
  for(const w of walls){const tgt=w.isCut(camera.position)?0.06:1;w.cut+=(tgt-w.cut)*Math.min(1,dt*9);w.shell.scale.y=w.cut;w.mounted.visible=w.cut>0.6;}
  // Render
  renderer.setRenderTarget(rtC);renderer.render(scene,camera);
  camera.layers.set(0);scene.overrideMaterial=normalMat;scene.background=NBG;
  renderer.setRenderTarget(rtN);renderer.render(scene,camera);
  scene.overrideMaterial=null;scene.background=BG;camera.layers.enable(1);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
