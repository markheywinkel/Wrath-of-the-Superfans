<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Ein ruhiger Flug durch ein kleines Sonnensystem.">
  <title>Space</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2304050d'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ffc94a'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23ffc94a'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%23ffc94a'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Sonnensystem – tippe, um das Raumschiff zu steuern"></canvas>

  <div class="hud-left">
    <div id="hud" class="hud" aria-label="Fortschritt">
      <span class="counter" id="coinBox" title="Münzen">
        <svg class="coin-icon" viewBox="0 0 7 9" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2" y="0" width="3" height="9" fill="#c98a1e"/>
          <rect x="1" y="1" width="5" height="7" fill="#c98a1e"/>
          <rect x="0" y="2" width="7" height="5" fill="#c98a1e"/>
          <rect x="2" y="1" width="3" height="7" fill="#f7c948"/>
          <rect x="1" y="2" width="5" height="5" fill="#f7c948"/>
          <rect x="2" y="2" width="1" height="3" fill="#fff1a8"/>
          <rect x="4" y="3" width="1" height="3" fill="#d99a2b"/>
        </svg>
        <span id="coinCount">0</span><span class="of">/&nbsp;<span id="coinTotal">30</span></span>
      </span>
      <span class="counter" id="crateBox" title="Frachtcontainer">
        <svg class="crate-icon" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="0" y="1" width="9" height="8" fill="#7a3a12"/>
          <rect x="1" y="2" width="7" height="6" fill="#e07b2c"/>
          <rect x="1" y="4" width="7" height="2" fill="#3a8aa8"/>
          <rect x="1" y="2" width="7" height="1" fill="#f5a35a"/>
          <rect x="3" y="0" width="3" height="1" fill="#ff5a5a"/>
        </svg>
        <span id="crateCount">0</span><span class="of">/&nbsp;<span id="crateTotal">10</span></span>
      </span>
    </div>
    <ul id="quests" class="quests" aria-label="Aufträge"></ul>
  </div>

  <div id="badges" class="badges" aria-label="Badges"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="intro" class="intro" aria-live="polite"></div>
  <div id="hint" class="hint"></div>

  <section id="dialog" class="panel dialog" aria-live="polite">
    <div class="cast" aria-hidden="true"></div>
    <div class="cast-me" aria-hidden="true"></div>
    <p class="who"><span class="name"></span><span class="role"></span></p>
    <p class="line"></p>
    <div class="foot">
      <span class="progress"></span>
      <button type="button" class="btn primary next"></button>
    </div>
  </section>

  <section id="info" class="panel info" aria-live="polite">
    <button class="close" type="button" aria-label="Schließen">×</button>
    <p class="kicker"></p>
    <h2 class="name"></h2>
    <p class="body"></p>
    <dl class="facts"></dl>
  </section>

  <div id="reward" class="modal" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="panel reward-panel">
      <div class="reward-icon" aria-hidden="true"></div>
      <h2 id="rewardTitle"></h2>
      <p class="body"></p>
      <div class="actions">
        <button type="button" class="btn primary" data-action="continue"></button>
      </div>
    </div>
  </div>

  <script src="texts.js"></script>
  <script src="game.js"></script>
</body>
</html>
