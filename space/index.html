<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Ein ruhiger Flug durch ein kleines Sonnensystem.">
  <title>Space</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2304050d'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ffc94a'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23ffc94a'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%23ffc94a'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Sonnensystem – tippe, um das Raumschiff zu steuern"></canvas>

  <div class="hud-left">
    <div id="hud" class="hud box" aria-label="Fortschritt">
      <span class="counter" id="coinBox" title="Kristalle">
        <svg class="crystal-icon" viewBox="0 0 6 9" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2" y="0" width="2" height="9" fill="#1d5aa8"/>
          <rect x="1" y="1" width="4" height="7" fill="#1d5aa8"/>
          <rect x="0" y="2" width="6" height="4" fill="#1d5aa8"/>
          <rect x="1" y="2" width="2" height="4" fill="#bff6ff"/>
          <rect x="3" y="2" width="2" height="4" fill="#5fd3ff"/>
          <rect x="2" y="1" width="1" height="1" fill="#e8fdff"/>
          <rect x="2" y="6" width="2" height="1" fill="#3a9ae8"/>
        </svg>
        <span id="coinCount">0</span><span class="of">/&nbsp;<span id="coinTotal">30</span></span>
      </span>
      <span class="counter" id="crateBox" title="Frachtcontainer">
        <svg class="crate-icon" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="0" y="1" width="9" height="8" fill="#7a3a12"/>
          <rect x="1" y="2" width="7" height="6" fill="#e07b2c"/>
          <rect x="1" y="4" width="7" height="2" fill="#3a8aa8"/>
          <rect x="1" y="2" width="7" height="1" fill="#f5a35a"/>
          <rect x="3" y="0" width="3" height="1" fill="#ff5a5a"/>
        </svg>
        <span id="crateCount">0</span><span class="of">/&nbsp;<span id="crateTotal">10</span></span>
      </span>
    </div>
    <ul id="quests" class="quests" aria-label="Aufträge"></ul>
  </div>

  <div class="top-right">
    <div id="badges" class="badges" aria-label="Badges"></div>
    <button id="sound" class="sound" type="button" aria-pressed="true" aria-label="Ton aus" title="Ton aus">
      <svg viewBox="0 0 11 9" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="0" y="3" width="2" height="3" fill="currentColor"/>
        <rect x="2" y="2" width="1" height="5" fill="currentColor"/>
        <rect x="3" y="1" width="1" height="7" fill="currentColor"/>
        <rect x="4" y="0" width="1" height="9" fill="currentColor"/>
        <g class="on">
          <rect x="6" y="3" width="1" height="3" fill="currentColor"/>
          <rect x="8" y="2" width="1" height="1" fill="currentColor"/>
          <rect x="9" y="3" width="1" height="3" fill="currentColor"/>
          <rect x="8" y="6" width="1" height="1" fill="currentColor"/>
        </g>
        <g class="off">
          <rect x="6" y="2" width="1" height="1" fill="currentColor"/>
          <rect x="7" y="3" width="1" height="1" fill="currentColor"/>
          <rect x="8" y="4" width="1" height="1" fill="currentColor"/>
          <rect x="9" y="5" width="1" height="1" fill="currentColor"/>
          <rect x="10" y="6" width="1" height="1" fill="currentColor"/>
          <rect x="10" y="2" width="1" height="1" fill="currentColor"/>
          <rect x="9" y="3" width="1" height="1" fill="currentColor"/>
          <rect x="7" y="5" width="1" height="1" fill="currentColor"/>
          <rect x="6" y="6" width="1" height="1" fill="currentColor"/>
        </g>
      </svg>
    </button>
  </div>
  <div id="labels" class="labels" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="pickup" class="pickup" aria-live="polite"></div>

  <div class="cine-bar top" aria-hidden="true"></div>
  <div class="cine-bar bottom" aria-hidden="true"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="intro" class="intro" aria-live="polite"></div>

  <section id="dialog" class="box dialog" aria-live="polite">
    <div class="figures" aria-hidden="true">
      <img class="figure them" alt="">
      <img class="figure me" alt="">
    </div>
    <p class="who"><span class="name"></span></p>
    <p class="line"></p>
    <div class="foot">
      <button type="button" class="btn primary next"></button>
    </div>
  </section>

  <section id="info" class="box info" aria-live="polite">
    <p class="kicker"></p>
    <h2 class="name"></h2>
    <p class="body"></p>
  </section>

  <div id="reward" class="modal" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="box reward-panel">
      <h2 id="rewardTitle"></h2>
      <p class="body"></p>
      <div class="actions">
        <button type="button" class="btn primary" data-action="continue"></button>
        <button type="button" class="btn" data-action="restart"></button>
      </div>
    </div>
  </div>

  <script src="texts.js"></script>
  <script src="game.js"></script>
</body>
</html>
